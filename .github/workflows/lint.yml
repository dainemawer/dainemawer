name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint MDX
        run: pnpm lint:mdx

      - name: Test
        run: pnpm test

      # Known high or critical advisories in anything that ships (dev-only
      # tooling is left out). Dependabot opens the fix PRs.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high
